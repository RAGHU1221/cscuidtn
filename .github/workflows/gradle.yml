name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Locate Android project
        id: proj
        run: |
          if [ -f settings.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            dir=$(dirname "$(find . -maxdepth 3 -name settings.gradle -not -path '*/build/*' | head -1)")
            if [ -z "$dir" ] || [ "$dir" = "." ]; then
              echo "settings.gradle not found in repo!" && exit 1
            fi
            echo "dir=$dir" >> "$GITHUB_OUTPUT"
          fi
          echo "Project found at: $(cat $GITHUB_OUTPUT)"

      - name: Build Debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Collect APK
        run: |
          apk=$(find . -path '*outputs/apk/debug/app-debug.apk' | head -1)
          cp "$apk" CSC-ASK-MIS.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSC-ASK-MIS-APK
          path: CSC-ASK-MIS.apk
